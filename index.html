<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Lambda Theme Maker</title>
        <link rel="stylesheet" href="style/global.css">
        <script type="module" src="./JS/main.js"></script>
        <link rel="icon" type="image/png" href="./images/icon.png">
    </head>
    <body>
        <header>
            <img src="./images/lambda.png" alt="lambda image">
        </header>
        <div id="title_p">
            <h1 class="title">Lambda Theme Maker</h1>
            <h3>Make a theme for Lambda OS</h3>
        </div>
        <main>
            <a href="https://github.com/100Sp4rk100/Lambda-OS#dynamic-profile">Get more information here</a>
            <br>
            <h1 class="title">Customize the userland colors</h1>
            <section id="colors" class="color_grid">
            </section>
            <br>
            <section>
                <h1 class="title">Customize the userland style</h1>
                <div class="style_part">
                    <input type="checkbox" id="squareIcon" title="It changes the form of icons (a circle or a square). Checked = circle">
                    <label for="squareIcon">Icons in a circle</label>
                    <br>
                    <input type="checkbox" id="dynamicImage" title="It changes the yellow on the icons images with YellowDark that you have set previously">
                    <label for="dynamicImage">Dynamic colors on images</label>
                    <select id="iconProfil" title="If you don't want dynamic colors, select your color profile : Epsilon default theme or Lambda theme">
                        <option value="epsilon">Epsilon profile</option>
                        <option value="lambda">Lambda profile</option>
                    </select>
                </div>
                <h1 class="title">Customize the userland background</h1>
                <div class="style_part">
                    <input type="checkbox" id="haveBackground" title="if it's checked you can give a background number to select an integrated background">
                    <label for="haveBackground">Activate background</label>
                    <input type="number" min ="1" value="1" id="background" style="visibility: hidden;" title="Select an integrated background or import it">
                    <br>
                    <br>
                    <input type="checkbox" id="haveImageBackground" style="visibility: hidden;" title="Import a background">
                    <label for="haveImageBackground" id="haveImageBackgroundLabel" style="visibility: hidden;">Import background</label>
                    <label for="background_input" class="file_input_label" id="background_input_text" style="visibility: hidden;" title=".png">Import a background</label>
                    <input type="file" id="background_input">
                    <br>
                    <br>
                    <br>
                </div>
                <h1 class="title">Customize the icons</h1>
                <div>
                    <input type="checkbox" id="customImageCheck" title="Change images of the userland">
                    <label for="customImageCheck">Customs images</label>
                    <section id="images" class="images_grid" style="visibility: hidden;">
                    </section>
                </div>
            </section>
            <br>
            <section>
                <button id="connect_upload_btn">Connect calculator</button>
                <button id="delete_btn" style="visibility: hidden;">Delete theme on calculator</button>
            </section>
            <br>
            <section>
                <button id="download_btn">Download theme</button>
                <label for="import_input" class="file_input_label" id="import_input_text">Import a theme</label>
                <input type="file" id="import_input">
            </section>
            <br>
            Console :
            <section class="style_part">
                <div id="console" style="overflow:scroll; height:400px;"></div>
            </section>
        </main>
        <br>
        <footer>
            <a href="https://github.com/100Sp4rk100/Lambda-Theme-Maker-WebSite">WebSite Source Code</a>
            <br>
            <a href="https://github.com/100Sp4rk100/Lambda-OS">Userland Source Code</a>
            <br>
            <a href="https://github.com/100Sp4rk100">Made by 100Sp4rk100</a>
        </footer>
    </body>
</html>
